
name: Build Signed Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Find and extract ZIP
      - name: Extract Android project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found!"
            exit 1
          fi

          echo "Found: $ZIP_FILE"

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

      # 3. Locate Android project
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          GRADLE_FILE=$(find extracted \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$GRADLE_FILE" ]; then
            GRADLE_FILE=$(find extracted \
              \( -name build.gradle -o -name build.gradle.kts \) \
              -print -quit)
          fi

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: No Gradle project found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"

      # 4. Setup JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 5. Setup Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 6. Install Android SDK components
      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      # 7. Install Gradle 8.13
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # 8. Check Gradle installation
      - name: Check Gradle
        run: |
          gradle --version

      # 9. Decode Android Keystore
      - name: Decode Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is missing!"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

          echo "Keystore decoded successfully."

      # 10. Build signed release APK
      - name: Build Signed Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease \
            --stacktrace \
            --info \
            --console=plain

      # 11. Verify APK signature
      - name: Verify APK Signature
        shell: bash
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" \
            -path "*/build/outputs/apk/release/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found!"
            exit 1
          fi

          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"

          echo "APK signature verified!"

      # 12. Upload release APK
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      # 13. Cleanup keystore
      - name: Cleanup Keystore
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release.jks"
